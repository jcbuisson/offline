name: offline

services:
  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: ${ELECTRIC_DATABASE_URL:?Set ELECTRIC_DATABASE_URL to a PostgreSQL URL using host.docker.internal as the hostname}
      # Development only. Configure ELECTRIC_SECRET before exposing this service.
      ELECTRIC_INSECURE: "true"
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
